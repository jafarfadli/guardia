<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Ikon bar</title>
<style>body { margin: 16px; background: #F5EDDB; } canvas { margin: 6px; width: 66px; height: 66px; }</style>
</head>
<body>
<script type="module">
import { ICONS, drawIcon, setIconInk } from './icons.js';
const S = 2;
const night = new URLSearchParams(location.search).get('ink') === 'night';
if (night) { setIconInk('#EADDC2'); document.body.style.background = '#352820'; }
const out = {};
for (const name of Object.keys(ICONS)) {
  const c = document.createElement('canvas');
  c.width = 22 * S; c.height = 22 * S;
  const ctx = c.getContext('2d');
  ctx.lineJoin = 'round';
  drawIcon(ctx, name, S);
  document.body.appendChild(c);
  out[name] = c.toDataURL('image/png');
}
window.__icons = out;
window.__kamar = { ready: true, light: {}, ms: 0 };
</script>
</body>
</html>
